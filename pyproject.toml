[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dummym"
version = "0.1.0"
description = "From-scratch Llama-like language model pretraining project"
requires-python = ">=3.10"
dependencies = [
    "tensorboard>=2.16",
    "tokenizers>=0.21,<1",
    "torch>=2.2",
]

[project.optional-dependencies]
train = [
    "numpy>=1.24",
    "PyYAML>=6",
]
data = [
    "numpy>=1.24",
    "pyarrow>=14",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
